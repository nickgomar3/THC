version: 2.1

orbs:
  python: circleci/python@2.1.1

jobs:
  build-and-test:
    docker:
      - image: cimg/python:3.13
        environment:
          DATABASE_URL: postgresql+psycopg://challengeuser:challpass@db/test_thchallenge
                
      - image: postgres:15-alpine
        name: db
        environment:
          POSTGRES_USER: challengeuser
          POSTGRES_PASSWORD: challpass
          POSTGRES_DB: test_thchallenge

    steps:
      - checkout

      # Instalar uv de forma global y rápida
      - run:
          name: Install uv
          command: |
            curl -LsSf https://astral.sh/uv/install.sh | sh
            echo 'export PATH="$HOME/.local/bin:$PATH"' >> $BASH_ENV

      # Sincronizar dependencias con uv (lee tu pyproject.toml y el grupo dev)
      - run:
          name: Install dependencies with uv
          command: |
            uv sync --group dev

      # Esperar a que PostgreSQL esté listo en el host 'db'
      - run:
          name: Wait for PostgreSQL
          command: |
            dockerize -wait tcp://db:5432 -timeout 1m

      # 1. Ejecutar pytest midiendo la cobertura (genera el archivo .coverage por defecto)
      - run:
          name: Run tests with pytest
          command: |
            uv run pytest --cov=modules --cov=core
      
      # 2. Enviar el reporte a Coveralls usando el archivo de cobertura estándar
      - run:
          name: Upload coverage to Coveralls
          command: |
            uv run pip install coveralls
            uv run coveralls --service=circle-ci
          environment:
            COVERALLS_REPO_TOKEN: $COVERALLS_REPO_TOKEN

workflows:
  test-workflow:
    jobs:
      - build-and-test